name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plexonutility-full-stable-release
  cancel-in-progress: false

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact stable source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Capture exact source SHA
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Read project version
        id: project
        shell: bash
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Verify full stable source boundary
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.project.outputs.version }}"
          test "$version" = '3.5.0'
          case "$version" in
            *-SNAPSHOT|*-RC*|*-rc*|*-alpha*|*-beta*|*-preview*|*-pre*)
              echo "Full stable workflow refuses prerelease version: $version" >&2
              exit 1
              ;;
          esac

          git fetch origin main
          test "${{ steps.source.outputs.sha }}" = "$(git rev-parse origin/main)"
          test -s "releases/${version}.md"
          test -z "$(git ls-remote --tags origin "refs/tags/v${version}" || true)"

      - name: Provision immutable PlexonCore 2.1.0
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.1.0.jar"
          curl --fail --location --silent --show-error \
            --output "$core_jar" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.1.0/PlexonCore-2.1.0.jar"
          echo "7ee823ded87d5be9c62426b04571c0d0d6b11c138575ca2c91838586c9f7576c  $core_jar" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core_jar" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=2.1.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: First clean stable build
        run: mvn -B -ntp clean verify

      - name: Verify tests and stable distribution
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.project.outputs.version }}"
          JAR="target/PlexonUtility-${VERSION}.jar"
          test -s "$JAR"

          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for path in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print("TEST_SUMMARY " + " ".join(f"{k}={v}" for k, v in totals.items()))
          if totals["tests"] == 0 or any(totals[k] != 0 for k in ("failures", "errors", "skipped")):
              sys.exit(1)
          PY

          jar tf "$JAR" > target/jar-contents.txt
          for resource in plugin.yml config.yml messages.yml; do
            grep -qx "$resource" target/jar-contents.txt
          done

          for class in \
            'com/zpkdxgames/plexonutility/PlexonUtilityPlugin.class' \
            'com/zpkdxgames/plexonutility/api/PlexonUtilityAPI.class' \
            'com/zpkdxgames/plexonutility/api/AfkState.class' \
            'com/zpkdxgames/plexonutility/api/event/AfkStateChangeEvent.class' \
            'com/zpkdxgames/plexonutility/api/event/VanishStateChangeEvent.class' \
            'com/zpkdxgames/plexonutility/api/event/SyntheticPresencePresentationEvent.class' \
            'com/zpkdxgames/plexonutility/admin/entity/EntitySelector.class' \
            'com/zpkdxgames/plexonutility/admin/entity/EntityCleanupService.class' \
            'com/zpkdxgames/plexonutility/admin/entity/WildStackerAdapter.class' \
            'com/zpkdxgames/plexonutility/admin/entity/EntitySpawnService.class' \
            'com/zpkdxgames/plexonutility/admin/gui/Admin350MenuService.class' \
            'com/zpkdxgames/plexonutility/admin/player/PlayerManagementService.class' \
            'com/zpkdxgames/plexonutility/admin/vanish/SyntheticPresenceBridge.class' \
            'com/zpkdxgames/plexonutility/admin/vanish/VanishService.class' \
            'com/zpkdxgames/plexonutility/command/EntityAdminCommand.class' \
            'com/zpkdxgames/plexonutility/command/PlayerAdminCommand.class' \
            'com/zpkdxgames/plexonutility/admin/inventory/InventoryInspectionService.class'; do
            grep -qx "$class" target/jar-contents.txt
          done

          unzip -p "$JAR" plugin.yml > target/plugin.yml
          grep -F "version: '${VERSION}'" target/plugin.yml
          grep -F "api-version: '26.2'" target/plugin.yml
          grep -F "plexonutility.afk.auto.bypass:" target/plugin.yml
          grep -F "plexonutility.fly:" target/plugin.yml
          grep -F "plexonutility.feed:" target/plugin.yml
          grep -F "plexonutility.enderchest:" target/plugin.yml
          grep -F "plexonutility.admin.killall.bypass-confirm:" target/plugin.yml
          grep -F "  - WildStacker" target/plugin.yml

          for command in utility utilityadmin invsee vanish kick ban unban prison trash afk killall spawnmob gamemode fly god speed clearinventory anvil; do
            grep -F "  ${command}:" target/plugin.yml
          done

          if grep -q '^  spawn:' target/plugin.yml; then
            echo 'PlexonUtility must not register root /spawn; PlexonTravel owns it.' >&2
            exit 1
          fi

          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -F "Implementation-Version: ${VERSION}"
          javap -verbose -classpath "$JAR" com.zpkdxgames.plexonutility.PlexonUtilityPlugin | grep -F 'major version: 69'

          for prefix in \
            'com/zpkdxgames/plexoncore/' \
            'me/clip/placeholderapi/' \
            'io/papermc/' \
            'org/bukkit/' \
            'net/kyori/adventure/'; do
            if grep -q "^${prefix}" target/jar-contents.txt; then
              echo "Provided runtime classes must not be bundled: ${prefix}" >&2
              exit 1
            fi
          done

          first_hash="$(sha256sum "$JAR" | awk '{print $1}')"
          cp "$JAR" "${RUNNER_TEMP}/PlexonUtility-first-build.jar"
          echo "first_hash=$first_hash" >> "$GITHUB_ENV"
          git diff --check

      - name: Second clean stable build
        run: mvn -B -ntp clean verify

      - name: Prove deterministic full stable artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.project.outputs.version }}"
          JAR="target/PlexonUtility-${VERSION}.jar"
          second_hash="$(sha256sum "$JAR" | awk '{print $1}')"
          test "$second_hash" = "$first_hash"
          cmp --silent "$JAR" "${RUNNER_TEMP}/PlexonUtility-first-build.jar"
          echo "stable_hash=$second_hash" >> "$GITHUB_ENV"
          (cd target && sha256sum "PlexonUtility-${VERSION}.jar" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)

      - name: Generate final test summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for path in sorted(glob.glob("target/surefire-reports/TEST-*.xml")):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))

          passed = totals["tests"] > 0 and all(
              totals[key] == 0 for key in ("failures", "errors", "skipped")
          )
          lines = [
              "repository=ZpkDxGames/PlexonUtility",
              f"version={os.environ['PROJECT_VERSION']}",
              f"commit={os.environ['SOURCE_SHA']}",
              *(f"{key}={value}" for key, value in totals.items()),
              f"artifact_sha256={os.environ['STABLE_HASH']}",
              f"result={'PASS' if passed else 'FAIL'}",
          ]
          output = "\n".join(lines) + "\n"
          print(output, end="")
          open("target/TEST_SUMMARY.txt", "w", encoding="utf-8").write(output)
          if not passed:
              sys.exit(1)
          PY
        env:
          PROJECT_VERSION: ${{ steps.project.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          STABLE_HASH: ${{ env.stable_hash }}

      - name: Generate full stable provenance
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.project.outputs.version }}"
          cat > target/PROVENANCE.txt <<EOF
          repository=ZpkDxGames/PlexonUtility
          version=${VERSION}
          release_channel=STABLE
          release_model=FULL_STABLE
          prerelease=false
          commit=${{ steps.source.outputs.sha }}
          artifact_sha256=${stable_hash}
          java=25
          class_major=69
          paper_api=26.2.build.121-stable
          plexoncore_compile_boundary=2.1.0
          plexoncore_sha256=7ee823ded87d5be9c62426b04571c0d0d6b11c138575ca2c91838586c9f7576c
          source_audit=COMPLETE
          unit_integration_distribution_tests=PASS
          deterministic_double_build=PASS
          runtime_validation=POST_RELEASE
          spawn_ownership=PlexonTravel
          entity_spawn_command=/spawnmob
          EOF

      - name: Publish GitHub full stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.project.outputs.version }}
          target_commitish: ${{ steps.source.outputs.sha }}
          name: PlexonUtility ${{ steps.project.outputs.version }}
          prerelease: false
          make_latest: true
          body_path: releases/${{ steps.project.outputs.version }}.md
          files: |
            target/PlexonUtility-${{ steps.project.outputs.version }}.jar
            target/SHA256SUMS.txt
            target/TEST_SUMMARY.txt
            target/PROVENANCE.txt
