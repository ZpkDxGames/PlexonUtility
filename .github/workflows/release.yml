name: Release

on:
  push:
    branches:
      - 'release/stable'
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: plexonutility-stable-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact stable candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Capture exact source SHA
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Read project version
        id: project
        shell: bash
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Verify stable release boundary
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.project.outputs.version }}"
          if [ "${GITHUB_EVENT_NAME}" = 'push' ]; then
            test "${GITHUB_REF_NAME}" = 'release/stable'
          fi
          case "${version}" in
            *-*) echo "Stable release workflow refuses prerelease version: ${version}" >&2; exit 1 ;;
          esac
          git fetch origin main
          test "${{ steps.source.outputs.sha }}" = "$(git rev-parse origin/main)"
          test -s "releases/${version}.md"
          test -z "$(git ls-remote --tags origin "refs/tags/v${version}" || true)"

      - name: Provision immutable PlexonCore 2.0.5
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.5.jar"
          curl --fail --location --silent --show-error \
            --output "$core_jar" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.5/PlexonCore-2.0.5.jar"
          echo "bf4df796e83571e76c06b296c75c5e73ddc8053cb2c587d74c08cd3922e0b4d4  $core_jar" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core_jar" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=2.0.5 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Verify release build
        run: mvn -B -ntp clean verify

      - name: Generate test summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for path in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          passed = totals["tests"] > 0 and all(totals[k] == 0 for k in ("failures", "errors", "skipped"))
          version = os.environ.get("PROJECT_VERSION", "unknown")
          lines = [
              "repository=ZpkDxGames/PlexonUtility",
              f"version={version}",
              f"commit={os.environ['SOURCE_SHA']}",
              *(f"{key}={value}" for key, value in totals.items()),
              f"result={'PASS' if passed else 'FAIL'}",
          ]
          text = "\n".join(lines) + "\n"
          print(text, end="")
          with open('target/TEST_SUMMARY.txt', 'w', encoding='utf-8') as fh:
              fh.write(text)
          if not passed:
              sys.exit(1)
          PY
        env:
          PROJECT_VERSION: ${{ steps.project.outputs.version }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}

      - name: Verify distribution and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.project.outputs.version }}"
          JAR="target/PlexonUtility-${VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" > target/jar-contents.txt
          for resource in plugin.yml config.yml messages.yml; do
            grep -qx "$resource" target/jar-contents.txt
          done
          for class in \
            'com/zpkdxgames/plexonutility/PlexonUtilityPlugin.class' \
            'com/zpkdxgames/plexonutility/api/PlexonUtilityAPI.class' \
            'com/zpkdxgames/plexonutility/api/event/AfkStateChangeEvent.class' \
            'com/zpkdxgames/plexonutility/afk/AfkManager.class' \
            'com/zpkdxgames/plexonutility/afk/AfkTracker.class' \
            'com/zpkdxgames/plexonutility/feedback/FeedbackService.class' \
            'com/zpkdxgames/plexonutility/integration/ComplementService.class' \
            'com/zpkdxgames/plexonutility/integration/FamilyCompatibilityService.class' \
            'com/zpkdxgames/plexonutility/menu/UtilityMenuModel.class' \
            'com/zpkdxgames/plexonutility/menu/UtilityMenuService.class' \
            'com/zpkdxgames/plexonutility/trash/TrashService.class' \
            'com/zpkdxgames/plexonutility/placeholder/UtilityPlaceholderExpansion.class'; do
            grep -qx "$class" target/jar-contents.txt
          done
          unzip -p "$JAR" plugin.yml | grep -F "version: '${VERSION}'"
          unzip -p "$JAR" plugin.yml | grep -F "api-version: '26.2'"
          unzip -p "$JAR" plugin.yml | grep -F '  utility:'
          unzip -p "$JAR" plugin.yml | grep -F '  trash:'
          unzip -p "$JAR" plugin.yml | grep -F '  afk:'
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -F "Implementation-Version: ${VERSION}"
          javap -verbose -classpath "$JAR" com.zpkdxgames.plexonutility.PlexonUtilityPlugin | grep -F 'major version: 69'
          for prefix in \
            'com/zpkdxgames/plexoncore/' \
            'me/clip/placeholderapi/' \
            'io/papermc/' \
            'org/bukkit/' \
            'net/kyori/adventure/'; do
            if grep -q "^${prefix}" target/jar-contents.txt; then
              echo "Provided runtime classes must not be bundled: ${prefix}" >&2
              exit 1
            fi
          done
          (cd target && sha256sum "PlexonUtility-${VERSION}.jar" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          git diff --check

      - name: Generate provenance
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.project.outputs.version }}"
          cat > target/PROVENANCE.txt <<EOF
          repository=ZpkDxGames/PlexonUtility
          trigger=${GITHUB_EVENT_NAME}
          version=${VERSION}
          tag=v${VERSION}
          commit=${{ steps.source.outputs.sha }}
          java=25
          class_major=69
          paper_api=26.2.build.121-stable
          plexoncore_compile_boundary=2.0.5
          core_services=text,gui,scheduler,integrations
          utility_capabilities=quiet-feedback,afk-state,afk-event,placeholderapi,family-compatibility,premium-utility-menu
          source_closure=VERIFIED
          runtime_deployment=FOLLOW_UP_NON_BLOCKING
          EOF

      - name: Publish GitHub stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.project.outputs.version }}
          target_commitish: ${{ steps.source.outputs.sha }}
          name: PlexonUtility ${{ steps.project.outputs.version }}
          prerelease: false
          body_path: releases/${{ steps.project.outputs.version }}.md
          files: |
            target/PlexonUtility-${{ steps.project.outputs.version }}.jar
            target/SHA256SUMS.txt
            target/TEST_SUMMARY.txt
            target/PROVENANCE.txt
