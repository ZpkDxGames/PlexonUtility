name: Agent 3.3 compile fix

on:
  push:
    branches:
      - release/3.3.0-admin-toolkit

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add temporary 3.3 compile-fix workflow'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/3.3.0-admin-toolkit
          fetch-depth: 0
      - name: Apply covariant player-list fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/main/java/com/zpkdxgames/plexonutility/admin/gui/AdminMenuService.java')
          text = path.read_text()
          old = '''        List<Player> online = Bukkit.getOnlinePlayers().stream()\n                .filter(Player::isConnected)\n                .sorted(Comparator.comparing(Player::getName, String.CASE_INSENSITIVE_ORDER))\n                .toList();'''
          new = '''        List<? extends Player> online = Bukkit.getOnlinePlayers().stream()\n                .filter(Player::isConnected)\n                .sorted(Comparator.comparing(Player::getName, String.CASE_INSENSITIVE_ORDER))\n                .toList();'''
          if old not in text:
              raise SystemExit('Expected player-list block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/agent-3.3-compile-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/zpkdxgames/plexonutility/admin/gui/AdminMenuService.java .github/workflows/agent-3.3-compile-fix.yml
          git diff --cached --check
          git commit -m 'Fix admin player selector covariance'
          git push origin HEAD:release/3.3.0-admin-toolkit
