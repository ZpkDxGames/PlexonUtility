name: Publish PlexonUtility 1.0.1 RC1

on:
  push:
    branches:
      - phase2/1.0.1-utility-product-hardening

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: plexonutility-1.0.1-rc.1-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Require source and PR CI success for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            runs="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/runs" -f head_sha="$GITHUB_SHA" -f per_page=30)"
            push_state="$(jq -r '[.workflow_runs[] | select(.name == "Build" and .event == "push")][0] | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end' <<<"$runs")"
            pr_state="$(jq -r '[.workflow_runs[] | select(.name == "Build" and .event == "pull_request")][0] | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end' <<<"$runs")"
            echo "source=${push_state} pr=${pr_state}"
            if [[ "$push_state" == "completed:success" && "$pr_state" == "completed:success" ]]; then
              exit 0
            fi
            if [[ "$push_state" == completed:* && "$push_state" != "completed:success" ]]; then
              echo "Source CI failed for $GITHUB_SHA" >&2
              exit 1
            fi
            if [[ "$pr_state" == completed:* && "$pr_state" != "completed:success" ]]; then
              echo "PR CI failed for $GITHUB_SHA" >&2
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for source and PR Build CI on $GITHUB_SHA" >&2
          exit 1

      - name: Verify release boundary is still open and immutable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='v1.0.1-rc.1'
          STABLE='v1.0.1'
          pr="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/2")"
          test "$(jq -r '.state' <<<"$pr")" = 'open'
          test "$(jq -r '.draft' <<<"$pr")" = 'true'
          test "$(jq -r '.merged_at // ""' <<<"$pr")" = ''
          test "$(jq -r '.head.sha' <<<"$pr")" = "$GITHUB_SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG release already exists; refusing to replace it" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "$TAG tag already exists; refusing to move it" >&2
            exit 1
          fi
          if gh release view "$STABLE" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${STABLE}" >/dev/null 2>&1; then
            echo "Stable $STABLE must remain unpublished during RC closure" >&2
            exit 1
          fi

      - name: Verify project version and release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          test "$VERSION" = '1.0.1-rc.1'
          test -s releases/1.0.1-rc.1.md

      - name: Provision immutable PlexonCore 2.0.0
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.0.jar"
          curl --fail --location --silent --show-error \
            --output "$core_jar" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.0/PlexonCore-2.0.0.jar"
          echo "179b82ce7fd82e3095b3a6d0d893af6d7c97f91bd7ce403e96d7f3581462dfec  $core_jar" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core_jar" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=2.0.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Test and package exact candidate
        run: mvn -B -ntp clean verify

      - name: Generate exact test summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import os
          import sys
          import xml.etree.ElementTree as ET

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for path in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          passed = totals["tests"] > 0 and all(totals[k] == 0 for k in ("failures", "errors", "skipped"))
          lines = [
              "repository=ZpkDxGames/PlexonUtility",
              "version=1.0.1-rc.1",
              f"commit={os.environ['GITHUB_SHA']}",
              *(f"{key}={value}" for key, value in totals.items()),
              f"result={'PASS' if passed else 'FAIL'}",
          ]
          text = "\n".join(lines) + "\n"
          print(text, end="")
          with open('target/TEST_SUMMARY.txt', 'w', encoding='utf-8') as fh:
              fh.write(text)
          if not passed:
              sys.exit(1)
          PY

      - name: Verify distribution and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION='1.0.1-rc.1'
          JAR="target/PlexonUtility-${VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" > target/jar-contents.txt
          for resource in plugin.yml config.yml messages.yml; do
            grep -qx "$resource" target/jar-contents.txt
          done
          grep -qx 'com/zpkdxgames/plexonutility/PlexonUtilityPlugin.class' target/jar-contents.txt
          grep -qx 'com/zpkdxgames/plexonutility/api/PlexonUtilityAPI.class' target/jar-contents.txt
          unzip -p "$JAR" plugin.yml | grep -F "version: '${VERSION}'"
          unzip -p "$JAR" plugin.yml | grep -F "api-version: '26.2'"
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -F "Implementation-Version: ${VERSION}"
          javap -verbose -classpath "$JAR" com.zpkdxgames.plexonutility.PlexonUtilityPlugin | grep -F 'major version: 69'
          for prefix in \
            'com/zpkdxgames/plexoncore/' \
            'me/clip/placeholderapi/' \
            'io/papermc/' \
            'org/bukkit/' \
            'net/kyori/adventure/'; do
            if grep -q "^${prefix}" target/jar-contents.txt; then
              echo "Provided runtime classes must not be bundled: ${prefix}" >&2
              exit 1
            fi
          done
          (cd target && sha256sum "PlexonUtility-${VERSION}.jar" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)

      - name: Generate provenance
        shell: bash
        run: |
          set -euo pipefail
          cat > target/PROVENANCE.txt <<EOF
          repository=ZpkDxGames/PlexonUtility
          branch=phase2/1.0.1-utility-product-hardening
          version=1.0.1-rc.1
          tag=v1.0.1-rc.1
          commit=${GITHUB_SHA}
          rollback_tag=v1.0.0
          rollback_commit=0cc055049258b619a4d0928e0018b2e8d9999ce5
          pull_request=2
          pull_request_state=OPEN_DRAFT_UNMERGED
          java=25
          class_major=69
          paper_api=26.2.build.121-stable
          plexoncore=2.0.0
          runtime_certification=NOT_EXECUTED
          stable_v1.0.1=UNPUBLISHED
          EOF

      - name: Tag exact frozen candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.0.1-rc.1 "$GITHUB_SHA" -m 'PlexonUtility 1.0.1-rc.1'
          git push origin v1.0.1-rc.1

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.0.1-rc.1 \
            target/PlexonUtility-1.0.1-rc.1.jar \
            target/SHA256SUMS.txt \
            target/TEST_SUMMARY.txt \
            target/PROVENANCE.txt \
            --verify-tag \
            --prerelease \
            --title 'PlexonUtility 1.0.1-rc.1' \
            --notes-file releases/1.0.1-rc.1.md
