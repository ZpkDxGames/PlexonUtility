name: Build

on:
  push:
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Provision immutable PlexonCore 2.0.5
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.5.jar"
          curl --fail --location --silent --show-error \
            --output "$core_jar" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.5/PlexonCore-2.0.5.jar"
          echo "bf4df796e83571e76c06b296c75c5e73ddc8053cb2c587d74c08cd3922e0b4d4  $core_jar" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core_jar" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=2.0.5 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Test and package
        run: mvn -B -ntp clean verify

      - name: Require every discovered test to pass and run
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for path in sorted(glob.glob('target/surefire-reports/TEST-*.xml')):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.attrib.get(key, 0))
          print("TEST_SUMMARY " + " ".join(f"{key}={value}" for key, value in totals.items()))
          if totals["tests"] == 0 or any(totals[key] != 0 for key in ("failures", "errors", "skipped")):
              sys.exit(1)
          PY

      - name: Verify 3.3 distribution
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          test "$VERSION" = '3.3.0'
          JAR="target/PlexonUtility-${VERSION}.jar"
          test -s "$JAR"
          jar tf "$JAR" > target/jar-contents.txt
          for resource in plugin.yml config.yml messages.yml; do
            grep -qx "$resource" target/jar-contents.txt
          done
          for class in \
            'com/zpkdxgames/plexonutility/PlexonUtilityPlugin.class' \
            'com/zpkdxgames/plexonutility/api/PlexonUtilityAPI.class' \
            'com/zpkdxgames/plexonutility/api/event/AfkStateChangeEvent.class' \
            'com/zpkdxgames/plexonutility/afk/AfkManager.class' \
            'com/zpkdxgames/plexonutility/afk/AfkTracker.class' \
            'com/zpkdxgames/plexonutility/admin/AdminAuditService.class' \
            'com/zpkdxgames/plexonutility/admin/AdminDataStore.class' \
            'com/zpkdxgames/plexonutility/admin/gui/AdminMenuService.class' \
            'com/zpkdxgames/plexonutility/admin/inventory/InventoryInspectionService.class' \
            'com/zpkdxgames/plexonutility/admin/moderation/ModerationService.class' \
            'com/zpkdxgames/plexonutility/admin/moderation/DurationParser.class' \
            'com/zpkdxgames/plexonutility/admin/prison/PrisonService.class' \
            'com/zpkdxgames/plexonutility/admin/vanish/VanishService.class' \
            'com/zpkdxgames/plexonutility/admin/vanish/VanishListener.class' \
            'com/zpkdxgames/plexonutility/command/AdminActionCommand.class' \
            'com/zpkdxgames/plexonutility/feedback/FeedbackService.class' \
            'com/zpkdxgames/plexonutility/integration/ComplementService.class' \
            'com/zpkdxgames/plexonutility/integration/FamilyCompatibilityService.class' \
            'com/zpkdxgames/plexonutility/menu/UtilityMenuItemFactory.class' \
            'com/zpkdxgames/plexonutility/menu/UtilityMenuModel.class' \
            'com/zpkdxgames/plexonutility/menu/UtilityMenuService.class' \
            'com/zpkdxgames/plexonutility/service/PlayerUtilityService.class' \
            'com/zpkdxgames/plexonutility/trash/TrashService.class' \
            'com/zpkdxgames/plexonutility/placeholder/UtilityPlaceholderExpansion.class'; do
            grep -qx "$class" target/jar-contents.txt
          done
          unzip -p "$JAR" plugin.yml > target/plugin.yml
          grep -F "version: '${VERSION}'" target/plugin.yml
          grep -F "api-version: '26.2'" target/plugin.yml
          for command in utility utilityadmin invsee vanish kick ban unban prison trash afk; do
            grep -F "  ${command}:" target/plugin.yml
          done
          unzip -p "$JAR" META-INF/MANIFEST.MF | tr -d '\r' | grep -F "Implementation-Version: ${VERSION}"
          javap -verbose -classpath "$JAR" com.zpkdxgames.plexonutility.PlexonUtilityPlugin | grep -F 'major version: 69'
          for prefix in \
            'com/zpkdxgames/plexoncore/' \
            'me/clip/placeholderapi/' \
            'io/papermc/' \
            'org/bukkit/' \
            'net/kyori/adventure/'; do
            if grep -q "^${prefix}" target/jar-contents.txt; then
              echo "Provided runtime classes must not be bundled: ${prefix}" >&2
              exit 1
            fi
          done
          (cd target && sha256sum "PlexonUtility-${VERSION}.jar" > SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          git diff --check

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlexonUtility-${{ github.sha }}
          path: |
            target/PlexonUtility-*.jar
            target/SHA256SUMS.txt
