name: Build

on:
  push:
    branches-ignore:
      - main
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Provision immutable PlexonCore 2.0.0
        shell: bash
        run: |
          set -euo pipefail
          core_jar="${RUNNER_TEMP}/PlexonCore-2.0.0.jar"
          curl --fail --location --silent --show-error \
            --output "$core_jar" \
            "https://github.com/ZpkDxGames/PlexonCore/releases/download/v2.0.0/PlexonCore-2.0.0.jar"
          echo "179b82ce7fd82e3095b3a6d0d893af6d7c97f91bd7ce403e96d7f3581462dfec  $core_jar" | sha256sum --check
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile="$core_jar" \
            -DgroupId=com.zpkdxgames \
            -DartifactId=PlexonCore \
            -Dversion=2.0.0 \
            -Dpackaging=jar \
            -DgeneratePom=true

      - name: Test and package
        run: mvn -B -ntp clean verify

      - name: Verify distribution
        shell: bash
        run: |
          set -euo pipefail
          JAR="target/PlexonUtility-1.0.0.jar"
          test -s "$JAR"
          jar tf "$JAR" > target/jar-contents.txt
          grep -qx 'plugin.yml' target/jar-contents.txt
          grep -qx 'com/zpkdxgames/plexonutility/PlexonUtilityPlugin.class' target/jar-contents.txt
          grep -qx 'com/zpkdxgames/plexonutility/api/PlexonUtilityAPI.class' target/jar-contents.txt
          unzip -p "$JAR" plugin.yml | grep -F "version: '1.0.0'"
          unzip -p "$JAR" plugin.yml | grep -F "api-version: '26.2'"
          javap -verbose -classpath "$JAR" com.zpkdxgames.plexonutility.PlexonUtilityPlugin | grep -F 'major version: 69'
          if grep -q '^com/zpkdxgames/plexoncore/' target/jar-contents.txt; then
            echo "PlexonCore runtime classes must not be shaded into PlexonUtility" >&2
            exit 1
          fi
          if grep -q '^io/papermc/' target/jar-contents.txt || grep -q '^org/bukkit/' target/jar-contents.txt; then
            echo "Paper/Bukkit runtime classes must not be bundled into PlexonUtility" >&2
            exit 1
          fi
