name: PlexonUtility
version: '${project.version}'
main: com.zpkdxgames.plexonutility.PlexonUtilityPlugin
api-version: '26.2'
depend:
  - PlexonCore
softdepend:
  - PlaceholderAPI
  - PlexonHomes
  - PlexonChats
loadbefore:
  - Essentials
commands:
  utility:
    description: Open the PlexonUtility hub.
    usage: /utility
    aliases: [utilities, putility]
    permission: plexonutility.menu
  feed:
    description: Restore hunger and saturation.
    usage: /feed [player]
    aliases: [pfeed]
    permission: plexonutility.feed
  heal:
    description: Restore health and clear configured effects.
    usage: /heal [player]
    aliases: [pheal]
    permission: plexonutility.heal
  enderchest:
    description: Open your or another online player's Ender Chest.
    usage: /enderchest [player]
    aliases: [ec, pec]
    permission: plexonutility.enderchest
  workbench:
    description: Open a virtual crafting table.
    usage: /workbench
    aliases: [wb, pworkbench]
    permission: plexonutility.workbench
  trash:
    description: Open a disposable trash inventory. Items left behind are destroyed.
    usage: /trash
    aliases: [disposal, ptrash]
    permission: plexonutility.trash
  afk:
    description: Toggle your AFK state.
    usage: /afk
    permission: plexonutility.afk
  utilityadmin:
    description: Open the PlexonUtility Admin Center or use text diagnostics/reload.
    usage: /utilityadmin [diagnostics|family|integrations|reload]
    aliases: [uadmin]
    permission: plexonutility.admin.menu
  invsee:
    description: Inspect an online player's inventory; live editing requires a separate permission.
    usage: /invsee <player>
    permission: plexonutility.admin.invsee
  vanish:
    description: Toggle native staff self-vanish.
    usage: /vanish [on|off]
    permission: plexonutility.admin.vanish
  kick:
    description: Remove an online player with an optional reason.
    usage: /kick <player> [reason...]
    permission: plexonutility.admin.kick
  ban:
    description: Apply a native profile ban to a known player.
    usage: /ban <player> [duration|perm] [reason...]
    permission: plexonutility.admin.ban
  unban:
    description: Remove an active native profile ban.
    usage: /unban <player>
    permission: plexonutility.admin.unban
  prison:
    description: Manage the PlexonUtility prison holding waypoint.
    usage: /prison <status|set|goto|send|clear> [player]
    permission: plexonutility.admin.prison
  killall:
    description: Remove matching entities safely from the selected scope.
    usage: /killall <category|entity> [radius|world [world]]
    aliases: [entityclear, mobclear]
    permission: plexonutility.admin.killall
  spawnmob:
    description: Spawn a bounded amount of an entity.
    usage: /spawnmob <entity> [amount]
    aliases: [mobspawn, entityspawn]
    permission: plexonutility.admin.spawnmob
  gamemode:
    description: Change game mode.
    usage: /gamemode <survival|creative|adventure|spectator> [player]
    aliases: [gm]
    permission: plexonutility.admin.gamemode
  fly:
    description: Toggle controlled survival/adventure flight.
    usage: /fly [on|off] [player]
    permission: plexonutility.admin.fly
  god:
    description: Toggle event-driven god mode.
    usage: /god [on|off] [player]
    permission: plexonutility.admin.god
  speed:
    description: Set or reset walk/fly speed.
    usage: /speed <1-10|reset> [walk|fly] [player]
    permission: plexonutility.admin.speed
  clearinventory:
    description: Clear your or another player's full inventory.
    usage: /clearinventory [player]
    aliases: [ci, clearinv]
    permission: plexonutility.admin.clearinventory
  anvil:
    description: Open a native virtual anvil.
    usage: /anvil
    permission: plexonutility.anvil
permissions:
  plexonutility.menu:
    default: true
  plexonutility.feed:
    default: true
  plexonutility.feed.others:
    default: op
  plexonutility.feed.cooldown.bypass:
    default: op
  plexonutility.heal:
    default: true
  plexonutility.heal.others:
    default: op
  plexonutility.heal.cooldown.bypass:
    default: op
  plexonutility.enderchest:
    default: true
  plexonutility.enderchest.others:
    default: op
  plexonutility.workbench:
    default: true
  plexonutility.trash:
    default: true
  plexonutility.afk:
    default: true
  plexonutility.afk.auto.bypass:
    default: op
  plexonutility.anvil:
    default: false

  plexonutility.admin:
    default: op
    children:
      plexonutility.admin.menu: true
      plexonutility.admin.invsee: true
      plexonutility.admin.invsee.edit: true
      plexonutility.admin.vanish: true
      plexonutility.admin.vanish.see: true
      plexonutility.admin.kick: true
      plexonutility.admin.ban: true
      plexonutility.admin.unban: true
      plexonutility.admin.prison: true
      plexonutility.admin.prison.set: true
      plexonutility.admin.prison.goto: true
      plexonutility.admin.prison.send: true
      plexonutility.admin.prison.clear: true
      plexonutility.admin.teleport: true
      plexonutility.admin.clearinventory: true
      plexonutility.admin.clearinventory.others: true
      plexonutility.admin.killall: true
      plexonutility.admin.killall.world: true
      plexonutility.admin.killall.bypass-confirm: true
      plexonutility.admin.spawnmob: true
      plexonutility.admin.gamemode: true
      plexonutility.admin.gamemode.others: true
      plexonutility.admin.fly: true
      plexonutility.admin.fly.others: true
      plexonutility.admin.god: true
      plexonutility.admin.god.others: true
      plexonutility.admin.speed: true
      plexonutility.admin.speed.others: true
      plexonutility.anvil: true
      plexonutility.reload: true
  plexonutility.admin.menu:
    default: false
  plexonutility.admin.invsee:
    default: false
  plexonutility.admin.invsee.edit:
    default: false
  plexonutility.admin.vanish:
    default: false
  plexonutility.admin.vanish.see:
    default: false
  plexonutility.admin.kick:
    default: false
  plexonutility.admin.ban:
    default: false
  plexonutility.admin.unban:
    default: false
  plexonutility.admin.prison:
    default: false
    children:
      plexonutility.admin.prison.set: true
      plexonutility.admin.prison.goto: true
      plexonutility.admin.prison.send: true
      plexonutility.admin.prison.clear: true
  plexonutility.admin.prison.set:
    default: false
  plexonutility.admin.prison.goto:
    default: false
  plexonutility.admin.prison.send:
    default: false
  plexonutility.admin.prison.clear:
    default: false
  plexonutility.admin.teleport:
    default: false
  plexonutility.admin.clearinventory:
    default: false
  plexonutility.admin.clearinventory.others:
    default: false
  plexonutility.admin.killall:
    default: false
  plexonutility.admin.killall.world:
    default: false
  plexonutility.admin.killall.bypass-confirm:
    default: false
  plexonutility.admin.spawnmob:
    default: false
  plexonutility.admin.gamemode:
    default: false
  plexonutility.admin.gamemode.others:
    default: false
  plexonutility.admin.fly:
    default: false
  plexonutility.admin.fly.others:
    default: false
  plexonutility.admin.god:
    default: false
  plexonutility.admin.god.others:
    default: false
  plexonutility.admin.speed:
    default: false
  plexonutility.admin.speed.others:
    default: false
  plexonutility.reload:
    default: op
