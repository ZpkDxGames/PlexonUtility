features:
  # Core-native navigation surface powered by PlexonCore GuiService.
  menu: true
  feed: true
  heal: true
  enderchest: true
  workbench: true
  afk: true
  # Writable disposable inventory; contents are intentionally not persisted.
  trash: true

feed:
  food-level: 20
  saturation: 20.0
  reset-exhaustion: true
  cooldown-seconds: 0

heal:
  clear-fire: true
  clear-negative-effects: false
  negative-effects:
    - POISON
    - WITHER
    - BLINDNESS
    - NAUSEA
    - SLOWNESS
    - WEAKNESS
    - MINING_FATIGUE
    - HUNGER
    - DARKNESS
  cooldown-seconds: 0

afk:
  # AFK runtime state is intentionally ephemeral and resets on restart.
  auto-timeout:
    enabled: true
    seconds: 300
    # One shared O(online players) scan; never one task per player.
    scan-interval-seconds: 10
  announcements:
    enabled: true
  reset-on:
    # Movement only counts when the player changes block coordinates/world.
    movement: true
    chat: true
    command: true
    interaction: true
    block-change: true
    damage: true
  placeholder:
    active: ''
    afk: ' <gray>[AFK]</gray>'

# Quiet-by-default presentation policy. Errors and admin diagnostics still use chat.
feedback:
  # Successful self-actions such as /feed, /heal and /trash use the actionbar.
  utility-success-actionbar: true
  social-events:
    # AFK social lines are compact and prefixless by default.
    prefix: false
  afk:
    bossbar:
      enabled: true
      color: YELLOW
      overlay: PROGRESS
    return-actionbar:
      enabled: true
    # If AFK is toggled off almost immediately, suppress the public "is back" line.
    suppress-short-return-seconds: 8
