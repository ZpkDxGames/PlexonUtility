features:
  # Core-native navigation surface powered by PlexonCore GuiService.
  menu: true
  feed: true
  heal: true
  enderchest: true
  workbench: true
  afk: true
  # Writable disposable inventory; contents are intentionally not persisted.
  trash: true

feed:
  food-level: 20
  saturation: 20.0
  reset-exhaustion: true
  cooldown-seconds: 0

heal:
  clear-fire: true
  clear-negative-effects: false
  negative-effects:
    - POISON
    - WITHER
    - BLINDNESS
    - NAUSEA
    - SLOWNESS
    - WEAKNESS
    - MINING_FATIGUE
    - HUNGER
    - DARKNESS
  cooldown-seconds: 0

afk:
  # AFK runtime state is intentionally ephemeral and resets on restart.
  auto-timeout:
    enabled: true
    seconds: 300
    # One shared O(online players) scan; never one task per player.
    scan-interval-seconds: 10
  announcements:
    enabled: true
  reset-on:
    movement: true
    chat: true
    command: true
    interaction: true
    block-change: true
    damage: true
  placeholder:
    active: ''
    afk: ' <gray>[AFK]</gray>'

# Quiet-by-default presentation policy. Errors and admin diagnostics still use chat.
feedback:
  utility-success-actionbar: true
  social-events:
    prefix: false
  afk:
    bossbar:
      enabled: true
      color: YELLOW
      overlay: PROGRESS
    return-actionbar:
      enabled: true
    suppress-short-return-seconds: 8

# Native staff toolkit. Runtime state remains event-driven; no entity/vanish polling is introduced.
admin:
  enabled: true

  entity-management:
    enabled: true
    killall:
      enabled: true
      max-radius: 512
      confirmation-threshold: 250
      protect:
        named: true
        tamed: true
        villagers: true
        armor-stands: true
        displays: true
        plugin-metadata: true
    spawnmob:
      enabled: true
      # Hard runtime ceiling is always 100; this value may only lower it.
      max-amount: 100
      safe-location-search: true
      blocked-entity-types: []

  player-management:
    gamemode:
      enabled: true
    fly:
      enabled: true
    god:
      enabled: true
      # 3.5 keeps god mode restart-ephemeral. Persistence is reserved and must remain false.
      persist: false
    speed:
      enabled: true
    clearinventory:
      enabled: true
    anvil:
      enabled: true

  vanish:
    enabled: true
    persist: true
    suppress-join-quit: true
    synthetic-presence:
      enabled: true
      prefer-plexonchats: true
      audience: ORDINARY_PLAYERS
      fallback:
        quit: '<gray><player> left the game</gray>'
        join: '<gray><player> joined the game</gray>'

  moderation:
    kick:
      enabled: true
      default-reason: 'Removed by staff.'
    ban:
      enabled: true
      default-reason: 'Banned by staff.'
      max-duration-days: 3650
  prison:
    enabled: true
  inventory-inspection:
    enabled: true
